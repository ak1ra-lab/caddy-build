name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Update modules
        run: |
          go get -u $(go list -m -f '{{if not .Indirect}}{{.Path}}{{end}}' all)
          go mod tidy

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --exit-code go.mod go.sum; then
            git add go.mod go.sum
            git commit -m "chore: update dependencies"
            git push
          fi

      - name: Extract version
        id: version
        run: |
          CADDY_VER=$(grep -oP 'github\.com/caddyserver/caddy/v2\s+\K\S+' go.mod)
          echo "caddy=${CADDY_VER}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} \
              go build -trimpath -ldflags="-s -w" -o "caddy-${arch}" .
          done

      - name: Package
        run: |
          CADDY_VER="${{ steps.version.outputs.caddy }}"
          for arch in amd64 arm64; do
            BIN="caddy_${CADDY_VER}_linux_${arch}"
            mv "caddy-${arch}" "${BIN}"
            gzip -k "${BIN}"
          done

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.caddy }}
          files: "*.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
